<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Dental Pro | Endodonti Kazanç Takibi</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #0d9488;
      --accent-hover: #14b8a6;
      --accent-light: rgba(13, 148, 136, 0.15);
      --danger: #ef4444;
      --input-bg: #0f172a;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px 16px 4px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }

    .app-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .badge-endo {
      background: var(--accent-light);
      color: var(--accent-hover);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 20px;
      border: 1px solid rgba(20, 184, 166, 0.3);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag-btn {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
    }

    .tag-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-submit:active {
      background: var(--accent-hover);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 8px;
    }

    .stat-box span {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-box strong {
      font-size: 18px;
      color: var(--text-main);
    }

    .stat-box.highlight strong {
      color: var(--accent-hover);
    }

    .record-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .record-item:last-child {
      border-bottom: none;
    }

    .record-info h4 {
      font-size: 15px;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .record-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .record-right {
      text-align: right;
    }

    .record-amount {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-hover);
      margin-bottom: 4px;
    }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 11px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .tab-container {
      display: flex;
      background: var(--input-bg);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 12px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
    }

    .backup-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-sec {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Dental Pro</h1>
    <span class="badge-endo">Endodonti Uzmanlık</span>
  </header>

  <!-- FORM KARTI -->
  <main>
    <section class="card">
      <form id="recordForm" onsubmit="saveRecord(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="date">Tarih</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="tooth">Diş No</label>
            <input type="text" id="tooth" placeholder="Örn: 16" pattern="[0-9]*">
          </div>
        </div>

        <div class="form-group">
          <label for="patient">Hasta Adı Soyadı</label>
          <input type="text" id="patient" placeholder="Hasta Adı" required>
        </div>

        <div class="form-group">
          <label>Hızlı İşlem Seçimi (Endodonti)</label>
          <div class="quick-tags" id="procedureTags">
            <button type="button" class="tag-btn" onclick="selectTag(this, 'Kanal Tedavisi (KT)')">KT</button>
            <button type="button" class="tag-btn" onclick="selectTag(this, 'Kanal Yenileme (Re-Tx)')">Re-Tx</button>
            <button type="button" class="tag-btn" onclick="selectTag(this, 'Post-Core')">Post-Core</button>
            <button type="button" class="tag-btn" onclick="selectTag(this, 'MTA / Apeks')">MTA</button>
            <button type="button" class="tag-btn" onclick="selectTag(this, 'Kesik / Pansuman')">Kesik</button>
            <button type="button" class="tag-btn" onclick="selectTag(this, 'Daimi Dolgu')">Dolgu</button>
            <button type="button" class="tag-btn" onclick="selectTag(this, 'Kırık Eğe Çıkarma')">Eğe Çıkarma</button>
            <button type="button" class="tag-btn" onclick="selectTag(this, 'Acil / Konsültasyon')">Acil</button>
          </div>
          <input type="hidden" id="procedure" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="doctorType">Uygulayan</label>
            <select id="doctorType" onchange="toggleDoctorInput()">
              <option value="self">Ben Yaptım</option>
              <option value="other">Diğer Doktor</option>
            </select>
          </div>
          <div class="form-group">
            <label for="amount">Kazanç (€)</label>
            <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
          </div>
        </div>

        <div class="form-group hidden" id="otherDoctorGroup">
          <label for="otherDoctor">Doktor Adı</label>
          <input type="text" id="otherDoctor" placeholder="Dr. Adı">
        </div>

        <div class="form-group">
          <label for="note">Ek Not</label>
          <textarea id="note" rows="2" placeholder="Kanal sayısı, anatomik notlar vb..."></textarea>
        </div>

        <button type="submit" class="btn-submit">KAYDI EKLE</button>
      </form>
    </section>

    <!-- ÖZET VE İSTATİSTİK -->
    <section class="card">
      <div class="form-row" style="margin-bottom: 12px;">
        <div>
          <label for="reportMonth">Rapor Dönemi</label>
          <input type="month" id="reportMonth" onchange="renderData()">
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box highlight">
          <span>Aylık Toplam</span>
          <strong id="statTotal">0 €</strong>
        </div>
        <div class="stat-box">
          <span>İşlem Sayısı</span>
          <strong id="statCount">0</strong>
        </div>
        <div class="stat-box">
          <span>Kendi Kazancım</span>
          <strong id="statSelf">0 €</strong>
        </div>
        <div class="stat-box">
          <span>Diğer Doktorlar</span>
          <strong id="statOther">0 €</strong>
        </div>
      </div>
    </section>

    <!-- KAYIT GEÇMİŞİ -->
    <section class="card">
      <div class="tab-container">
        <button class="tab-btn active" id="tabList" onclick="switchTab('list')">İşlem Listesi</button>
        <button class="tab-btn" id="tabChart" onclick="switchTab('chart')">Grafik</button>
      </div>

      <div id="listView">
        <div id="recordList"></div>
      </div>

      <div id="chartView" class="hidden">
        <canvas id="monthlyChart" style="max-height: 220px;"></canvas>
      </div>
    </section>

    <!-- YEDEKLEME -->
    <section class="card">
      <label>Veri Yönetimi</label>
      <div class="backup-btns">
        <button type="button" class="btn-sec" onclick="exportData()">Yedeği İndir (JSON)</button>
        <button type="button" class="btn-sec" onclick="document.getElementById('fileInput').click()">Geri Yükle</button>
      </div>
      <input type="file" id="fileInput" class="hidden" accept=".json" onchange="importData(event)">
    </section>
  </main>

  <script>
    let db = [];
    let chartInstance = null;

    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      const currentMonth = today.slice(0, 7);
      
      document.getElementById('date').value = today;
      document.getElementById('reportMonth').value = currentMonth;

      loadData();
      renderData();
    });

    function loadData() {
      try {
        const saved = localStorage.getItem("dental_pro_endo_db");
        db = saved ? JSON.parse(saved) : [];
      } catch (e) {
        db = [];
      }
    }

    function saveData() {
      localStorage.setItem("dental_pro_endo_db", JSON.stringify(db));
      renderData();
    }

    function selectTag(element, value) {
      document.querySelectorAll('#procedureTags .tag-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('procedure').value = value;
    }

    function toggleDoctorInput() {
      const type = document.getElementById('doctorType').value;
      const group = document.getElementById('otherDoctorGroup');
      group.classList.toggle('hidden', type !== 'other');
    }

    function saveRecord(e) {
      e.preventDefault();

      const procedure = document.getElementById('procedure').value;
      if (!procedure) {
        alert("Lütfen hızlı işlemlerden birini seçin.");
        return;
      }

      const record = {
        id: Date.now().toString(),
        date: document.getElementById('date').value,
        tooth: document.getElementById('tooth').value.trim(),
        patient: document.getElementById('patient').value.trim(),
        procedure: procedure,
        doctorType: document.getElementById('doctorType').value,
        otherDoctor: document.getElementById('otherDoctor').value.trim(),
        amount: parseFloat(document.getElementById('amount').value) || 0,
        note: document.getElementById('note').value.trim()
      };

      db.push(record);
      saveData();

      document.getElementById('patient').value = '';
      document.getElementById('tooth').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      document.getElementById('procedure').value = '';
      document.querySelectorAll('#procedureTags .tag-btn').forEach(btn => btn.classList.remove('active'));
    }

    function deleteRecord(id) {
      if (confirm("Bu işlemi silmek istediğinize emin misiniz?")) {
        db = db.filter(item => item.id !== id);
        saveData();
      }
    }

    function renderData() {
      const selectedMonth = document.getElementById('reportMonth').value;
      const filtered = db.filter(item => item.date.startsWith(selectedMonth));

      let total = 0, selfTotal = 0, otherTotal = 0;

      filtered.forEach(item => {
        total += item.amount;
        if (item.doctorType === 'other') {
          otherTotal += item.amount;
        } else {
          selfTotal += item.amount;
        }
      });

      document.getElementById('statTotal').innerText = total.toLocaleString('de-DE', {minimumFractionDigits: 2}) + ' €';
      document.getElementById('statCount').innerText = filtered.length;
      document.getElementById('statSelf').innerText = selfTotal.toLocaleString('de-DE', {minimumFractionDigits: 2}) + ' €';
      document.getElementById('statOther').innerText = otherTotal.toLocaleString('de-DE', {minimumFractionDigits: 2}) + ' €';

      const listEl = document.getElementById('recordList');
      listEl.innerHTML = '';

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state">Bu ay için kayıt bulunamadı.</div>';
      } else {
        filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(item => {
          const docInfo = item.doctorType === 'other' ? ` (Dr. ${item.otherDoctor || 'Diğer'})` : '';
          const toothInfo = item.tooth ? ` | Diş: ${item.tooth}` : '';
          
          const html = `
            <div class="record-item">
              <div class="record-info">
                <h4>${item.patient}</h4>
                <p>${item.procedure}${toothInfo}</p>
                <p>${item.date}${docInfo}</p>
              </div>
              <div class="record-right">
                <div class="record-amount">${item.amount.toLocaleString('de-DE', {minimumFractionDigits: 2})} €</div>
                <button class="btn-del" onclick="deleteRecord('${item.id}')">Sil</button>
              </div>
            </div>
          `;
          listEl.innerHTML += html;
        });
      }

      renderChart(filtered);
    }

    function switchTab(tab) {
      document.getElementById('tabList').classList.toggle('active', tab === 'list');
      document.getElementById('tabChart').classList.toggle('active', tab === 'chart');
      document.getElementById('listView').classList.toggle('hidden', tab !== 'list');
      document.getElementById('chartView').classList.toggle('hidden', tab !== 'chart');
    }

    function renderChart(records) {
      const ctx = document.getElementById('monthlyChart').getContext('2d');
      
      const days = {};
      records.forEach(r => {
        const day = r.date.split('-')[2];
        days[day] = (days[day] || 0) + r.amount;
      });

      const labels = Object.keys(days).sort((a,b) => a - b);
      const data = labels.map(d => days[d]);

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels.map(l => l + ' Gün'),
          datasets: [{
            label: 'Günlük Kazanç (€)',
            data: data,
            backgroundColor: '#0d9488',
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `dental_pro_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            db = imported;
            saveData();
            alert("Veriler başarıyla yüklendi.");
          } else {
            alert("Geçersiz yedek dosyası.");
          }
        } catch (err) {
          alert("Dosya okunurken bir hata oluştu.");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
    </html>
